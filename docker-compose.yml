# Run the bot behind Caddy (automatic HTTPS) on a Droplet:
#   cp .env.example .env   # fill in BOT_PASSPHRASE, BOT_DOMAIN, ACME_EMAIL
#   docker compose up -d --build
# TradingView then POSTs to https://<BOT_DOMAIN>/webhook
services:
  bot:
    build: .
    image: tradingview-futures-bot
    # Not published to the host — only reachable by Caddy on the internal network.
    expose:
      - "8000"
    environment:
      BOT_PASSPHRASE: ${BOT_PASSPHRASE:?set BOT_PASSPHRASE in .env}
      # Execution backend: "stub" (mock) or "traderspost" (bridge to your broker).
      BOT_BROKER_TYPE: ${BOT_BROKER_TYPE:-stub}
      BOT_BROKER_URL: ${BOT_BROKER_URL:-https://demo.tradovate.example/v1}
      BOT_BROKER_TOKEN: ${BOT_BROKER_TOKEN:-demo-token}
      # TradersPost (used when BOT_BROKER_TYPE=traderspost)
      BOT_TRADERSPOST_WEBHOOK_URL: ${BOT_TRADERSPOST_WEBHOOK_URL:-}
      BOT_ACCOUNT_EQUITY: ${BOT_ACCOUNT_EQUITY:-50000}
      # Protective stop distance in points attached to each order (0 = off).
      BOT_STOP_LOSS_POINTS: ${BOT_STOP_LOSS_POINTS:-0}
      # Take-profit distance in points (0 = off). Some brokers require BOTH
      # stop + take-profit (they reject a lone stop as an unsupported OTO order).
      BOT_TAKE_PROFIT_POINTS: ${BOT_TAKE_PROFIT_POINTS:-0}
      # Optional Telegram alerts (leave empty to disable).
      BOT_TELEGRAM_TOKEN: ${BOT_TELEGRAM_TOKEN:-}
      BOT_TELEGRAM_CHAT_ID: ${BOT_TELEGRAM_CHAT_ID:-}
      BOT_DB_PATH: /data/bot_state.db
      BOT_ERROR_LOG: /data/error_log.json
    volumes:
      # Named volume = durable state across restarts/redeploys.
      - bot_state:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?set BOT_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates so they survive restarts (avoids LE rate limits).
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Streamlit walk-forward analyzer — on-demand, localhost-only (SSH tunnel).
  # Not started by default; launch with:  docker compose --profile tools up -d analyzer
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8501:8501"   # bound to localhost — reach via SSH tunnel only
    restart: unless-stopped

volumes:
  bot_state:
  caddy_data:
  caddy_config:

# DigitalOcean App Platform spec.
#   doctl apps create --spec .do/app.yaml
# (or paste into the App Platform UI). Deploys the Dockerfile from this repo.
#
# ⚠️ App Platform's local filesystem is EPHEMERAL — it is wiped on every
# redeploy/restart. The SQLite state at /data will NOT persist there, so
# positions + idempotency history reset on each deploy. For durable state on
# App Platform, attach a Managed Database (Postgres) and port bot/state.py to
# it, OR run on a Droplet with the docker-compose volume instead. The stub
# broker is fine to start with regardless.
name: tradingview-futures-bot
region: nyc
services:
  - name: bot
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: jrrodrz1620/nq-walkforward
      branch: claude/futures-tradingview-bot-65e0vj
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
    envs:
      - key: BOT_PASSPHRASE
        scope: RUN_TIME
        type: SECRET
      - key: BOT_BROKER_URL
        scope: RUN_TIME
        value: https://demo.tradovate.example/v1
      - key: BOT_BROKER_TOKEN
        scope: RUN_TIME
        type: SECRET
